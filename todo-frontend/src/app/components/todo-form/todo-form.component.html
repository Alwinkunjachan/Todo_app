<div class="todo-form-container">
  <h2>Add New Todo</h2>
  
  <form [formGroup]="todoForm" (ngSubmit)="onSubmit()" class="todo-form">
    <div class="form-group">
      <label for="title">Title *</label>
      <input 
        type="text" 
        id="title"
        formControlName="title"
        placeholder="Enter todo title"
        class="form-input"
        [class.error]="title?.invalid && title?.touched">
      <div *ngIf="title?.invalid && title?.touched" class="error-message">
        <span *ngIf="title?.errors?.['required']">Title is required</span>
        <span *ngIf="title?.errors?.['minlength']">Title must be at least 3 characters</span>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea 
        id="description"
        formControlName="description"
        placeholder="Enter todo description (optional)"
        rows="3"
        class="form-textarea"></textarea>
    </div>

    <div *ngIf="error" class="error-alert">
      {{ error }}
    </div>

    <div *ngIf="success" class="success-alert">
      Todo created successfully!
    </div>

    <button 
      type="submit" 
      class="submit-btn"
      [disabled]="todoForm.invalid || submitting">
      <span *ngIf="!submitting">Add Todo</span>
      <span *ngIf="submitting">Creating...</span>
    </button>
  </form>
</div>
